<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HTML → PDF Maker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1d212b;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #9aa3b2;
    --accent: #5b8cff;
    --accent-hover: #4577f0;
    --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
    letter-spacing: .2px;
    white-space: nowrap;
  }
  header h1 span { color: var(--accent); }

  .controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    flex: 1;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .field label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--muted);
  }

  input, select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
    font-family: var(--sans);
    outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input[type="number"] { width: 70px; }
  input#filename { width: 160px; }

  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s ease;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-weight: 500;
  }
  .btn.ghost:hover { color: var(--text); border-color: var(--accent); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 0;
  }

  .pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  .pane + .pane { border-left: 1px solid var(--border); }

  .pane-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--muted);
  }

  textarea#editor {
    flex: 1;
    border: none;
    resize: none;
    background: #12141a;
    color: #d4d7dd;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    padding: 14px;
    outline: none;
    tab-size: 2;
  }

  .preview-scroll {
    flex: 1;
    overflow: auto;
    background: #3a3d44;
    padding: 24px;
    display: flex;
    justify-content: center;
  }

  /* The actual page that gets exported */
  #page {
    background: #fff;
    color: #111;
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
    width: 210mm;          /* default A4 width, JS overrides */
    min-height: 297mm;
    padding: 15mm;
    transform-origin: top center;
  }

  .toast {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #20232c;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .pane + .pane { border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>HTML <span>→</span> PDF Maker</h1>
    <div class="controls">
      <div class="field">
        <label for="filename">Filename</label>
        <input id="filename" type="text" value="document" />
      </div>
      <div class="field">
        <label for="format">Page</label>
        <select id="format">
          <option value="a4" selected>A4</option>
          <option value="letter">Letter</option>
          <option value="legal">Legal</option>
          <option value="a3">A3</option>
          <option value="a5">A5</option>
        </select>
      </div>
      <div class="field">
        <label for="orientation">Orientation</label>
        <select id="orientation">
          <option value="portrait" selected>Portrait</option>
          <option value="landscape">Landscape</option>
        </select>
      </div>
      <div class="field">
        <label for="margin">Margin (mm)</label>
        <input id="margin" type="number" value="10" min="0" max="40" step="1" />
      </div>
      <div class="field">
        <label for="scale">Quality</label>
        <select id="scale">
          <option value="1">Standard</option>
          <option value="2" selected>High</option>
          <option value="3">Very high</option>
        </select>
      </div>
    </div>
    <button class="btn ghost" id="sampleBtn" title="Load sample content">Sample</button>
    <button class="btn" id="downloadBtn">Download PDF</button>
  </header>

  <main>
    <section class="pane">
      <div class="pane-head">
        <span>HTML / CSS Editor</span>
        <span id="autoNote">live preview</span>
      </div>
      <textarea id="editor" spellcheck="false"></textarea>
    </section>

    <section class="pane">
      <div class="pane-head"><span>Preview</span><span id="sizeNote">A4 · portrait</span></div>
      <div class="preview-scroll">
        <div id="page"></div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  const editor       = document.getElementById('editor');
  const page         = document.getElementById('page');
  const downloadBtn  = document.getElementById('downloadBtn');
  const sampleBtn    = document.getElementById('sampleBtn');
  const toast        = document.getElementById('toast');
  const sizeNote     = document.getElementById('sizeNote');

  // Page dimensions in mm [width, height] (portrait)
  const SIZES = {
    a3:     [297, 420],
    a4:     [210, 297],
    a5:     [148, 210],
    letter: [216, 279],
    legal:  [216, 356],
  };

  const SAMPLE = `<h1 style="color:#1a3b8b;border-bottom:3px solid #1a3b8b;padding-bottom:8px;">
  Invoice #00142
</h1>

<p style="color:#555;">Issued: 16 June 2026 &nbsp;•&nbsp; Due: 30 June 2026</p>

<div style="display:flex;justify-content:space-between;margin:24px 0;">
  <div>
    <strong>From</strong><br>
    Code7 Information Technology<br>
    Jeddah, Saudi Arabia<br>
    info@code7.ai
  </div>
  <div style="text-align:right;">
    <strong>Bill To</strong><br>
    Acme Trading Co.<br>
    Riyadh, Saudi Arabia
  </div>
</div>

<table style="width:100%;border-collapse:collapse;font-size:14px;">
  <thead>
    <tr style="background:#1a3b8b;color:#fff;">
      <th style="text-align:left;padding:10px;">Description</th>
      <th style="text-align:right;padding:10px;">Qty</th>
      <th style="text-align:right;padding:10px;">Rate</th>
      <th style="text-align:right;padding:10px;">Amount</th>
    </tr>
  </thead>
  <tbody>
    <tr style="border-bottom:1px solid #eee;">
      <td style="padding:10px;">IT Cost Audit</td>
      <td style="padding:10px;text-align:right;">1</td>
      <td style="padding:10px;text-align:right;">12,000</td>
      <td style="padding:10px;text-align:right;">12,000</td>
    </tr>
    <tr style="border-bottom:1px solid #eee;">
      <td style="padding:10px;">Optimization Report</td>
      <td style="padding:10px;text-align:right;">1</td>
      <td style="padding:10px;text-align:right;">4,500</td>
      <td style="padding:10px;text-align:right;">4,500</td>
    </tr>
  </tbody>
</table>

<p style="text-align:right;font-size:18px;margin-top:20px;">
  <strong>Total: SAR 16,500</strong>
</p>

<p style="margin-top:40px;color:#888;font-size:12px;text-align:center;">
  Thank you for your business.
</p>`;

  // ---- Live preview ----
  function renderPreview() {
    page.innerHTML = editor.value;
  }

  // ---- Page sizing in the preview ----
  function applyPageSize() {
    const fmt = document.getElementById('format').value;
    const orient = document.getElementById('orientation').value;
    const margin = document.getElementById('margin').value;
    let [w, h] = SIZES[fmt];
    if (orient === 'landscape') [w, h] = [h, w];
    page.style.width = w + 'mm';
    page.style.minHeight = h + 'mm';
    page.style.padding = margin + 'mm';
    sizeNote.textContent = fmt.toUpperCase() + ' · ' + orient;
  }

  // ---- Toast helper ----
  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // ---- Export to PDF ----
  function downloadPDF() {
    const fmt        = document.getElementById('format').value;
    const orient     = document.getElementById('orientation').value;
    const margin     = parseFloat(document.getElementById('margin').value) || 0;
    const scale      = parseFloat(document.getElementById('scale').value) || 2;
    const filename   = (document.getElementById('filename').value || 'document').trim();

    if (!page.innerHTML.trim()) {
      showToast('Nothing to export — add some HTML first.');
      return;
    }

    downloadBtn.disabled = true;
    downloadBtn.textContent = 'Generating…';

    const opt = {
      margin:      margin,
      filename:    filename.endsWith('.pdf') ? filename : filename + '.pdf',
      image:       { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: scale, useCORS: true, backgroundColor: '#ffffff' },
      jsPDF:       { unit: 'mm', format: fmt, orientation: orient },
      pagebreak:   { mode: ['css', 'legacy'] }
    };

    // Clone the page so the export margin (handled by jsPDF) isn't doubled
    const clone = page.cloneNode(true);
    clone.style.padding = '0';
    clone.style.boxShadow = 'none';
    clone.style.width = 'auto';
    clone.style.minHeight = 'auto';

    html2pdf().set(opt).from(clone).save()
      .then(() => showToast('PDF downloaded.'))
      .catch(err => { console.error(err); showToast('Export failed — see console.'); })
      .finally(() => {
        downloadBtn.disabled = false;
        downloadBtn.textContent = 'Download PDF';
      });
  }

  // ---- Wire up events ----
  editor.addEventListener('input', renderPreview);
  ['format', 'orientation', 'margin'].forEach(id =>
    document.getElementById(id).addEventListener('change', applyPageSize)
  );
  downloadBtn.addEventListener('click', downloadPDF);
  sampleBtn.addEventListener('click', () => {
    editor.value = SAMPLE;
    renderPreview();
    showToast('Sample loaded.');
  });

  // Tab key inserts spaces instead of leaving the textarea
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = editor.selectionStart, en = editor.selectionEnd;
      editor.value = editor.value.slice(0, s) + '  ' + editor.value.slice(en);
      editor.selectionStart = editor.selectionEnd = s + 2;
    }
  });

  // ---- Init ----
  editor.value = SAMPLE;
  renderPreview();
  applyPageSize();
</script>
</body>
</html>
